name: Release readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-secrets.sh

  listing-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listing-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: listing-backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  search-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-search/search-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: web-search/search-backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: web-search/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  member-center:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: member-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: member-center/package-lock.json
      - run: npm ci
      - run: npm run lint:release
      - run: npm run build
      - run: npm run audit:runtime

  deployment-config:
    runs-on: ubuntu-latest
    needs: [listing-api, search-api, web, member-center]
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose --env-file web-search/.env.production.example \
            -f web-search/docker-compose.yml config --quiet
      - run: |
          docker compose --env-file web-search/.env.production.example \
            -f web-search/docker-compose.yml build
      - run: |
          test "$(docker compose --env-file web-search/.env.production.example \
            -f web-search/docker-compose.yml config --services | grep -c '^caddy$')" -eq 0
          docker run --rm --entrypoint nginx \
            codropshipping/ui:1.0.0 -t

  release-package:
    runs-on: ubuntu-latest
    needs: [secret-scan, listing-api, search-api, web, member-center, deployment-config]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-release-package.sh "$RUNNER_TEMP/codropshipping-release"
      - run: cd "$RUNNER_TEMP/codropshipping-release" && sha256sum --check *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Codropshipping-1.0-Full
          path: |
            ${{ runner.temp }}/codropshipping-release/*.tar.gz
            ${{ runner.temp }}/codropshipping-release/*.sha256
          if-no-files-found: error
